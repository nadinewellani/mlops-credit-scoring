name: Retrain Model

on:
  push:
    paths:
      - "data/credit_scoring.csv"
      - "params.yaml"
      - "src/train.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ré-entraîner le modèle (tracking MLflow)
        run: python -m src.train

      - name: Publier les runs MLflow
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

      - name: Enregistrer le nouveau modèle dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f models/model_pipeline.joblib
          git diff --cached --quiet || (git commit -m "Auto: modèle ré-entraîné" && git push)